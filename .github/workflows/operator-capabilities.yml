name: Operator capability boundaries

"on":
  pull_request:
    paths:
      - ".ai-context.yml"
      - ".github/actions/wgx-check/**"
      - ".github/workflows/**"
      - ".wgx-tools/**"
      - "README.md"
      - "cmd/**"
      - "docs/**"
      - "fixtures/profile.valid.yml"
      - "guards/**"
      - "lib/**"
      - "modules/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
  push:
    branches: [main]
    paths:
      - ".ai-context.yml"
      - ".github/actions/wgx-check/**"
      - ".github/workflows/**"
      - ".wgx-tools/**"
      - "README.md"
      - "cmd/**"
      - "docs/**"
      - "fixtures/profile.valid.yml"
      - "guards/**"
      - "lib/**"
      - "modules/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Validate capability map
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_operator_capabilities.py

      - name: Run focused regression tests
        run: python3 -m unittest tests.test_operator_capabilities -v
