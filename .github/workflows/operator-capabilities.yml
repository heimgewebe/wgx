name: Operator capability boundaries

"on":
  pull_request:
    paths:
      - ".ai-context.yml"
      - ".github/workflows/operator-capabilities.yml"
      - "docs/operator-ecosystem-capabilities.md"
      - "docs/operator-ecosystem-capabilities.v1.json"
      - "fixtures/profile.valid.yml"
      - "scripts/validate_operator_capabilities.py"
      - "tests/test_operator_capabilities.py"
      - "templates/**"
  push:
    branches: [main]
    paths:
      - ".ai-context.yml"
      - ".github/workflows/operator-capabilities.yml"
      - "docs/operator-ecosystem-capabilities.md"
      - "docs/operator-ecosystem-capabilities.v1.json"
      - "fixtures/profile.valid.yml"
      - "scripts/validate_operator_capabilities.py"
      - "tests/test_operator_capabilities.py"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Validate capability map
        run: python3 scripts/validate_operator_capabilities.py

      - name: Run focused regression tests
        run: python3 -m unittest tests.test_operator_capabilities -v
