name: Temporary PR 654 docs convergence

on:
  push:
    branches:
      - "tmp/pr654-review-fix-20260801-1649"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate and verify
        run: |
          set -euo pipefail
          chmod +x wgx scripts/gen-cli-docs.sh
          python3 -m py_compile modules/validate_runner.py
          bash -n cmd/validate.bash
          scripts/gen-cli-docs.sh
          git diff --check

      - name: Commit generated documentation and remove temporary workflow
        env:
          TARGET_BRANCH: "tmp/pr654-review-fix-20260801-1649"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cli.md
          git rm .github/workflows/tmp-pr654-docs.yml
          git commit -m "Regenerate validation CLI documentation"
          git push origin "HEAD:${TARGET_BRANCH}"
