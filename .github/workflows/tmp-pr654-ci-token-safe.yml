name: Temporary PR 654 safe CI token convergence

on:
  push:
    branches:
      - "feat/wgx-validate-profiles-receipts"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch smart-CI Bats permissions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          token_expression = '$' + '{{ github.token }}'

          old_job = '''  bats_tests:
            name: Bats tests
            needs: changes
            if: |
          '''
          new_job = '''  bats_tests:
            name: Bats tests
            needs: changes
            permissions:
              contents: read
              pull-requests: read
            if: |
          '''
          old_step = '''      - name: Run bats test suites
                uses: ./.github/actions/run-bats
          '''
          new_step = f'''      - name: Run bats test suites
                env:
                  GITHUB_TOKEN: {token_expression}
                uses: ./.github/actions/run-bats
          '''

          if text.count(old_job) != 1:
              raise SystemExit('unexpected bats job shape')
          if text.count(old_step) != 1:
              raise SystemExit('unexpected bats step shape')
          path.write_text(text.replace(old_job, new_job, 1).replace(old_step, new_step, 1))
          PY
          grep -F 'GITHUB_TOKEN: ${{ github.token }}' .github/workflows/ci.yml
          git diff --check

      - name: Commit workflow correction and remove temporary workflow
        env:
          TARGET_BRANCH: "feat/wgx-validate-profiles-receipts"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git rm .github/workflows/tmp-pr654-ci-token-safe.yml
          git commit -m "Stabilize authenticated capability tests in smart CI"
          git push origin "HEAD:${TARGET_BRANCH}"
