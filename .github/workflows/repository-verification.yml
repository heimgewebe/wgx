---
name: repository-verification

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    uses: heimgewebe/metarepo/.github/workflows/reusable-repo-verify.yml@9d985c3a426d387173d8753b09dd5175a242a7d5
    with:
      mode: guard
    permissions:
      contents: read

  smoke:
    uses: heimgewebe/metarepo/.github/workflows/reusable-repo-verify.yml@9d985c3a426d387173d8753b09dd5175a242a7d5
    with:
      mode: smoke
    permissions:
      contents: read
