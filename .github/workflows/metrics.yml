name: "Metrics contract compatibility"
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/wgx-metrics-snapshot.sh"
      - "scripts/just-dispatch.sh"
      - "tests/contracts_validate.bats"
      - "tests/metrics_snapshot.bats"
      - "docs/operator-ecosystem-capabilities.v1.json"
      - "scripts/validate_operator_capabilities.py"
      - "tests/test_operator_capabilities.py"

env:
  METRICS_SCHEMA_URL: https://raw.githubusercontent.com/heimgewebe/metarepo/b215b418a038ff535f07b7888fd6adeb3f4de51c/contracts/metrics.snapshot.schema.json

jobs:
  contract-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq (for JSON validation helpers)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Ensure Node for ajv-cli
        uses: actions/setup-node@v4
        with:
          node-version: '20'          # Node 20 ist kompatibel mit dem verwendeten ajv-cli.
          # Kein npm-Cache am Repo-Root, da es hier keine package-lock.json gibt.
          # Der Cache würde ohne Lockfile fehlschlagen. Daher bewusst deaktiviert.

      - name: Produce compatibility fixture
        run: bash scripts/wgx-metrics-snapshot.sh --json
      - name: Fetch AJV schema (local file)
        run: |
          mkdir -p .ci
          curl -fsSL "$METRICS_SCHEMA_URL" -o .ci/metrics.schema.json

      - name: Validate metrics contract
        run: npx --yes ajv-cli@5 validate --spec=draft2020 --strict=log -s .ci/metrics.schema.json -d metrics.json
