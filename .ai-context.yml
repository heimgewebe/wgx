# Dieses Repo ist Teil des Heimgewebes.

ai_context_version: 1.1

project:
  name: wgx
  summary: Portable compatibility runner for repository-declared verification front doors.
  role: repository_verification_runner
  primary_language: bash
  visibility: internal

role_contract:
  name: repository_verification_runner
  authority: repository_local_execution_adapter
  owns:
    - profile_parser_compatibility
    - declared_task_dispatch
    - validation_receipts
  consumes:
    - metarepo_repository_verification_contract
    - repository_profiles
    - local_git_state
  produces:
    - declared_task_inventory
    - source_bound_validation_receipts
    - compatibility_results
  limits:
    - no_fleet_contract_ownership
    - no_reusable_ci_policy_ownership
    - no_task_truth
    - no_task_coordination
    - no_worker_leases
    - no_ledger_ownership
    - no_deploy_authority
    - no_generic_cross_repository_host_authority
  unavailable_effect: repository verification adapters degrade without changing task or runtime truth

dependencies:
  internal:
    - name: metarepo
      relationship: consumes
      interface:
        - repository-verification.v2
        - reusable-repo-verify
  external:
    - name: python3

architecture:
  entrypoints:
    - wgx
    - cli/wgx
  key_paths:
    - path: modules/profile_parser.py
      purpose: compatibility profile parsing
    - path: cmd/task.bash
      purpose: explicit repository-declared task dispatch
    - path: cmd/validate.bash
      purpose: quick/full validation and receipts
  data_flow:
    input: repository profile plus explicit command
    processing: parse and route to repository-declared verification front doors
    output: command result or deterministic validation receipt

conventions:
  branching: "main, feature/*"
  commit_prefix: "wgx"
  ci_platform: github_actions

documentation:
  runbook: docs/Runbook.de.md

ai_guidance:
  do:
    - keep compatibility behavior small and explicit
    - delegate shared verification policy to metarepo
  dont:
    - add fleet policy to the runner
    - add implicit event, task, deployment, service, or Git authority
