# Dieses Repo ist Teil des Heimgewebes.
# Systemweiter Kontext durch Heimgeist:
#   metarepo/ai-contexts/heimgeist.ai-context.yml

ai_context_version: 1.1

project:
  name: wgx
  summary: Repository verification adapter and fleet-invariant checks for Heimgewebe repositories.
  role: repository_verification_adapter
  primary_language: bash
  visibility: internal

role_contract:
  name: repository_verification_adapter
  authority: repository_local_verification
  owns:
    - profile_contract_parsing
    - fleet_invariant_checks
    - reusable_ci_checks
  consumes:
    - repository_profiles
    - contracts
    - local_git_state
  produces:
    - readiness_reports
    - metrics_contract_fixtures
    - guard_results
  limits:
    - no_task_truth
    - no_task_coordination
    - no_worker_leases
    - no_ledger_ownership
    - no_policy_application
    - no_deploy_authority
    - no_generic_cross_repository_host_authority
  unavailable_effect: guard_and_metrics_degrade_without_changing_task_truth

dependencies:
  internal:
    - name: contracts
      relationship: uses
      interface:
        - validation_hooks
    - name: chronik
      relationship: uses
      interface:
        - ci_e2e_orchestration
  external:
    - name: jq
    - name: curl

architecture:
  entrypoints:
    - wgx/cmd/*
  key_paths:
    - path: modules/
      purpose: subcommand implementations
  data_flow:
    input: repository profile and CI invocation
    processing: route to repository-declared verification front doors
    output: source-bound check results

conventions:
  branching: "main, feature/*"
  commit_prefix: "wgx"
  ci_platform: github_actions

documentation:
  runbook: docs/runbook.md

system_context:
  heimgeist: "../metarepo/ai-contexts/heimgeist.ai-context.yml"

ai_guidance:
  do:
    - compose subcommands; avoid global mutable state
  dont:
    - hardcode repo-specific paths in core modules
