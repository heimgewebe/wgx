wgx:
  apiVersion: v1
  requiredWgx: "^2.0"
  repoKind: "generic"
  # Which repository-native tasks each validation profile invokes.
  # quick = bounded agent feedback, full = merge-grade local validation.
  validate:
    quick: [lint, guard]
    full: [lint, guard, smoke, test]
    ciOnly:
      # Declared explicitly so the receipt reports them as skipped, not missing.
      release: "runs only in the release workflow"
  tasks:
    guard: "python3 scripts/validate_operator_capabilities.py && python3 scripts/check_wgx_guard_action_pins.py && python3 scripts/check_wgx_smoke_contract.py"
    smoke: "python3 scripts/validate_workflow.py .github/workflows/wgx-smoke.yml"
    test: "bats -r tests"
    lint: "FILES=$(git ls-files '*.sh' '*.bash'); shfmt -d $FILES && shellcheck -S style $FILES"
